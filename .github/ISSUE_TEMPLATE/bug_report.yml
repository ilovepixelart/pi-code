name: Bug report
description: Something in pi-code is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security issues. Report those privately via a [GitHub Security Advisory](https://github.com/ilovepixelart/pi-code/security/advisories/new); see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: versions
    attributes:
      label: Versions
      description: pi-code, pi, Node, and OS
      placeholder: "pi-code 1.0.5, pi x.y.z, Node 22.19, macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or config
      render: shell
