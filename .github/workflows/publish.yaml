name: Publish

on:
  release:
    types:
      - published
  # Recovery path for undelivered release events (observed 2026-08-06: GitHub dropped
  # the published event for v0.6.0 and its republish). The build checks out the tag
  # itself, so a dispatch publishes the tagged commit rather than whatever main holds.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.0)"
        required: true

# Read by default; jobs upgrade to the minimal scopes they need.
permissions:
  contents: read

jobs:
  # The check runs the dev toolchain (vitest, biome, knip, tsc) and every devDependency it
  # loads, so it holds no token: a compromised one cannot mint the OIDC token the build
  # signs with or touch the tarball before it is packed and attested.
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the default branch: a dispatch recovery run must check the
          # commit the tag names.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

  build:
    name: Build, attest, and pack
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the attestation bundle to the triggering release
      id-token: write # OIDC token for Sigstore keyless signing
      attestations: write # persist the build provenance attestation
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the default branch: a dispatch recovery run must build the
          # commit the tag names. Comparing version strings alone cannot catch this,
          # since main keeps the same version until the next bump.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # No dependency install here: npm pack needs only package.json and the files it
      # lists, so no third-party code runs while this job holds id-token: write.
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json ($pkg); bump the version before tagging." >&2
            exit 1
          fi

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls -1 pi-code-*.tgz | head -n1)
          echo "tarball-name=$tarball" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball-name }}

      - name: Attach attestation bundles to release
        # Publish provenance in extra channels beyond GitHub's native store and
        # npm's registry attestation (publishConfig.provenance: true):
        # <tarball>.sigstore.json is the full Sigstore bundle (offline verify via
        # `gh attestation verify --bundle`); <tarball>.intoto.jsonl is the in-toto
        # DSSE bundle slsa-verifier and OpenSSF Scorecard look for.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball-name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          sigstore="${TARBALL}.sigstore.json"
          cp "$BUNDLE_PATH" "$sigstore"
          intoto="${TARBALL}.intoto.jsonl"
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > "$intoto"
          gh release upload "$RELEASE_TAG" "$sigstore" "$intoto" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball-name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation via OIDC trusted publisher
    steps:
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball

      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball-name }}
        run: |
          set -euo pipefail
          version="${TARBALL#pi-code-}"
          version="${version%.tgz}"
          if npm view "pi-code@${version}" version >/dev/null 2>&1; then
            echo "pi-code@${version} is already published; skipping."
            exit 0
          fi
          npm publish "$TARBALL"
