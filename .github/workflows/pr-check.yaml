name: PR check

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A superseded push to a pull request is dead weight; cancel it. Every main commit needs
# its own result and its own Sonar main-branch analysis, so a push gets a group of its own:
# a shared group holds one pending run, and a third push replaced the second's.
# Releases are unaffected (publish.yaml has a group of its own).
concurrency:
  group: pr-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Biome, Types & Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One red leg must not hide another platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
        # package.json engines is >=22.19: the floor itself is tested, not only the latest 22.
        include:
          - os: ubuntu-latest
            node-version: 22.19.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installing dependencies
        # Transitive install scripts do not run in CI; nothing npm run check
        # needs depends on one, and a compromised postinstall would otherwise
        # execute in every PR.
        run: npm ci --ignore-scripts

      # npm 10 (bundled with Node 22) lacks the registry's newer signing keys and fails with
      # EMISSINGSIGNATUREKEY; the tree is identical on every leg, so verify it once on npm 11.
      - name: Verify provenance signatures
        if: matrix.node-version == '24.x'
        run: npm audit signatures

      - name: Check
        run: npm run check

      - name: Scan
        # One analysis per commit: the ubuntu/node-22 leg. qualitygate.wait makes
        # this step itself fail on a red gate instead of reporting advisory-only.
        if: env.SONAR_TOKEN && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.projectKey=ilovepixelart_${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=extensions
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**
            -Dsonar.qualitygate.wait=true

  smoke:
    name: Headless e2e smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Installing dependencies
        run: npm ci --ignore-scripts

      - name: Run the deterministic smoke
        # Boots the pi devDependency headless against a dead-port model and
        # asserts the exact provider payload; no real model or network needed.
        shell: bash
        run: bash scripts/e2e-smoke.sh

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows
        run: uvx zizmor@1.32.0 --config .github/zizmor.yml --format=plain .github

  ci:
    # The single status a ruleset can require: it stays red unless every job above
    # succeeded. None of them is conditional, so a skipped job counts as a failure.
    name: CI
    needs: [check, smoke, zizmor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          if jq -e 'all(.[]; . == "success")' <<< "$RESULTS" > /dev/null; then
            exit 0
          fi
          echo "At least one required job did not succeed." >&2
          exit 1
