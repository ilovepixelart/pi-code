name: PR check

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A superseded push's run is dead weight; cancel it. Releases are unaffected
# (publish.yaml has no concurrency group).
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Biome, Types & Tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One red leg must not hide another platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installing dependencies
        # Transitive install scripts do not run in CI; nothing npm run check
        # needs depends on one, and a compromised postinstall would otherwise
        # execute in every PR.
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Scan
        # One analysis per commit: the ubuntu/node-22 leg. qualitygate.wait makes
        # this step itself fail on a red gate instead of reporting advisory-only.
        if: env.SONAR_TOKEN && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.projectKey=ilovepixelart_${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=extensions
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**
            -Dsonar.qualitygate.wait=true

  smoke:
    name: Headless e2e smoke (pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # locked is the devDependency. 0.85.1 keeps a real pi from before the prompt
        # options (0.86) and native MCP (0.99) under test: the unit suite fakes those paths.
        pi: [locked, 0.85.1]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Installing dependencies
        run: npm ci --ignore-scripts

      - name: Install pi ${{ matrix.pi }}
        if: matrix.pi != 'locked'
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: npm install --no-save --ignore-scripts "@earendil-works/pi-agent-core@$PI_VERSION" "@earendil-works/pi-ai@$PI_VERSION" "@earendil-works/pi-coding-agent@$PI_VERSION" "@earendil-works/pi-tui@$PI_VERSION"

      - name: Run the deterministic smoke
        # Boots the pi devDependency headless against a dead-port model and
        # asserts the exact provider payload; no real model or network needed.
        run: bash scripts/e2e-smoke.sh
