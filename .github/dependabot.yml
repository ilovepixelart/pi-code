version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    # @types/node follows the lowest supported Node (engines); a newer major would let code
    # compile against APIs that runtime lacks, so majors move only with the engines floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # A dependency joins the first group it matches, so the groups run from most to
      # least specific. The pi packages pin each other with caret ranges: a lone bump
      # installs two copies with incompatible types, so every pi update, majors included,
      # moves as one set.
      pi:
        patterns: ["@earendil-works/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
